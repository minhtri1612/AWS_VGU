name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lambdas and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, syntax-check, and zip each Lambda
        run: |
          set -euo pipefail
          for dir in Lambda*; do
            echo "== $dir =="
            npm ci --omit=dev --prefix "$dir"
            node --check "$dir/index.js"
            (
              cd "$dir"
              rm -f lambda.zip
              zip -qr lambda.zip index.js node_modules package.json package-lock.json
            )
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        env:
          TF_VAR_db_password: CiDummyPass1
          TF_VAR_from_email: ci@example.com
        run: terraform validate

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and zip each Lambda
        run: |
          set -euo pipefail
          for dir in Lambda*; do
            npm ci --omit=dev --prefix "$dir"
            (
              cd "$dir"
              rm -f lambda.zip
              zip -qr lambda.zip index.js node_modules package.json package-lock.json
            )
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_from_email: ${{ secrets.TF_VAR_from_email }}
          TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
        run: terraform apply -auto-approve
