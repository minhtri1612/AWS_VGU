name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        type: choice
        options:
          - destroy
        default: destroy

jobs:
  check:
    name: Lambdas and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, syntax-check, and zip each Lambda
        run: |
          set -euo pipefail
          for dir in Lambda*; do
            echo "== $dir =="
            npm ci --omit=dev --prefix "$dir"
            node --check "$dir/index.js"
            (
              cd "$dir"
              rm -f lambda.zip
              zip -qr lambda.zip index.js node_modules package.json package-lock.json
            )
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        env:
          TF_VAR_db_password: CiDummyPass1
          TF_VAR_from_email: ci@example.com
          TF_VAR_github_token: ci-dummy-token
        run: terraform validate

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and zip each Lambda
        run: |
          set -euo pipefail
          for dir in Lambda*; do
            npm ci --omit=dev --prefix "$dir"
            (
              cd "$dir"
              rm -f lambda.zip
              zip -qr lambda.zip index.js node_modules package.json package-lock.json
            )
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_from_email: ${{ secrets.TF_VAR_FROM_EMAIL }}
          TF_VAR_secret_key: ${{ secrets.TF_VAR_SECRET_KEY }}
          TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
        run: terraform apply -auto-approve

      - name: Rebuild Amplify with the API URL
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
        run: |
          APP_ID=$(terraform output -raw amplify_app_id)
          aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name main \
            --job-type RELEASE \
            --region ap-southeast-2

  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and zip each Lambda
        run: |
          set -euo pipefail
          for dir in Lambda*; do
            npm ci --omit=dev --prefix "$dir"
            (
              cd "$dir"
              rm -f lambda.zip
              zip -qr lambda.zip index.js node_modules package.json package-lock.json
            )
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
        run: terraform init

      - name: Empty image buckets
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
          AWS_DEFAULT_REGION: ap-southeast-2
        run: |
          set -euo pipefail
          for bucket in minhtri-devops-cloud-photos-864992048128 minhtri-devops-cloud-thumbs-864992048128; do
            aws s3 rm "s3://${bucket}" --recursive || true
            python3 ../scripts/purge-s3-versions.py "$bucket" || true
            aws s3api delete-bucket --bucket "$bucket" || true
          done

      - name: Terraform destroy
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-southeast-2
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_from_email: ${{ secrets.TF_VAR_FROM_EMAIL }}
          TF_VAR_secret_key: ${{ secrets.TF_VAR_SECRET_KEY }}
          TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
        run: terraform destroy -auto-approve
